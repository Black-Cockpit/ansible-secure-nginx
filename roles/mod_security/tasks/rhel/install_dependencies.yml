# Update repository
- name: Updating repositories
  yum:
    update_cache: yes
    enablerepo: epel-release

# Install dependencies
- name: Installing dependencies
  dnf:
    name: "{{ item }}"
    state: installed
    update_cache: true
  loop:
  - "@Development Tools"
  - epel-release
  - httpd-devel 
  - pcre 
  - pcre-devel
  - libxml2 
  - libxml2-devel
  - curl 
  - curl-devel
  - openssl
  - openssl-devel
  - git
  - yajl
  - libinjection-devel

# Install GeoIP packages (differs by OS major version)
- name: Installing geoip-devel (RHEL < 9)
  dnf:
    name: geoip-devel
    state: installed
  when: ansible_distribution_major_version | int < 9

- name: Enabling CodeReady Builder repository (RHEL >= 9)
  command: >
    subscription-manager repos
    --enable codeready-builder-for-rhel-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-rpms
  when:
  - ansible_distribution_major_version | int >= 9
  - ansible_distribution == 'RedHat'
  changed_when: true

- name: Enabling CRB repository (RHEL-based >= 9, non-RHEL)
  command: dnf config-manager --set-enabled crb
  when:
  - ansible_distribution_major_version | int >= 9
  - ansible_distribution != 'RedHat'
  changed_when: true

- name: Installing libmaxminddb packages (RHEL >= 9)
  dnf:
    name: "{{ item }}"
    state: installed
  loop:
  - libmaxminddb
  - libmaxminddb-devel
  when: ansible_distribution_major_version | int >= 9
