# Integration test matrix for the hasnimehdi91.secure_nginx collection.
#
# Each entry is one disposable VM. The Vagrantfile defines one machine per
# entry and run.sh drives it through up -> install -> verify -> destroy.
# This file is the single source of truth: the machine definitions, the
# harness entry list and the generated Makefile targets are all read from it,
# so adding a platform is a new entry here and nothing else.
#
# Fields:
#   box             VirtualBox Vagrant box the entry boots
#   firmware        efi (the default) or bios — must match how the box's disk
#                   image boots, and getting it wrong hangs the boot rather
#                   than failing it
#   memory / cpus   VM resources
#   disk_size       marks the entry as needing the in-guest filesystem grow
#                   (provision/grow_disk.sh). It is a flag, not a request:
#                   the virtual disk is never resized, only the root
#                   partition inside a box that ships more disk than it
#                   partitions. The value records the size the box ships.
#   detection_only  optional, default false. Forwarded to both playbooks so
#                   the mod_security role runs in the mode verify.yml then
#                   asserts against. true keeps the engine in DetectionOnly
#                   and leaves the deny default action out, so the engine
#                   assertion expects DetectionOnly instead of On, the
#                   blocking-action assertion is dropped, and the functional
#                   probe expects the attack payload served and audited
#                   rather than answered with 403. No default entry sets it:
#                   the matrix tests what production runs, which is
#                   enforcement, and the field exists for hand runs.
#   crs_enabled     optional, default true. Forwarded to both playbooks so
#                   the Core Rule Set phase runs and verify.yml asserts the
#                   rule tree and sends the functional probe. false skips
#                   the phase, expects the single-include entry point, and
#                   drops the probe, which has nothing to block without the
#                   rule set.
#   crs_paranoia_level
#                   optional, default 1 (the role default). Forwarded to
#                   both playbooks so the Core Rule Set runs and is
#                   verified at that level. Both entries pin level 4, the
#                   strictest: the levels are cumulative, so the strict run
#                   evaluates every rule the lower levels carry, and a rule
#                   tree that runs clean at 4 runs clean at every level a
#                   deployment chooses.
#
# Both entries ask for more memory and cores than an installer test normally
# needs. The mod_security role compiles libmodsecurity and the nginx source
# on the target: make runs one job per core, so the core count is most of the
# wall clock, and the link step is where the memory peaks. Expect roughly
# 10-20 minutes per entry, nearly all of it in those two compiles.
#
# These two entries are the platforms the collection is tested on. The roles
# accept a wider list — RHEL, CentOS, Rocky, Oracle Linux and Debian all pass
# their platform assertions — but accepted is not the same claim as tested.
platforms:
  ubuntu2404:
    box: bento/ubuntu-24.04
    firmware: bios
    memory: 4096
    cpus: 4
    disk_size: 20GB
    crs_paranoia_level: 4

  alma10:
    box: almalinux/10
    memory: 4096
    cpus: 4
    disk_size: 20GB
    crs_paranoia_level: 4
