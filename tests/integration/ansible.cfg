# Ansible configuration for the integration harness.
#
# Paths are relative to this directory (tests/integration), which is where
# run.sh invokes ansible-playbook from. The repository root is two levels up,
# so the roles live at ../../roles. Nothing here is packaged: galaxy.yml's
# build_ignore excludes the whole tests tree from the published collection.
[defaults]
# The playbooks name the roles bare — "install", "mod_security" — rather than
# through the collection namespace, so a run tests the working tree instead
# of whatever copy of the collection happens to be installed on the host.
roles_path = ../../roles
# Vagrant regenerates the guest host key on every `vagrant up`, so a matrix
# entry that has been destroyed and recreated always presents an unknown key
host_key_checking = False
stdout_callback = default
retry_files_enabled = False

[ssh_connection]
# Pipelining is safe here and worth the speed: the mod_security role runs
# through several dozen small tasks, and pipelining saves a file transfer on
# each of them. It requires sudo without a tty, which holds because nothing
# in this collection edits sudoers — the reference harness disables
# pipelining for exactly that reason, and that reason does not apply to these
# roles.
pipelining = True
